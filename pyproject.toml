[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "0.1.0"
description = "A local voice- and gesture-driven laptop assistant foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jarvis = "jarvis.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

